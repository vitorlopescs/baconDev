<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Abaixo assinado da Saudade:</h1>
    <form>
        <label for="campo_nome">Nome do atleticano: </label>
        <input id="campo_nome" type="text" placeholder="Digite seu nome aqui" required>
        <br>
        <label for="campo_cidade">De qual cidade você está com saudade do Hulk no Galo agora? </label>
        <input id="campo_cidade" type="text" placeholder="Digite sua cidade aqui" required>
        <br>
        <label for="campo_xingamento">Deixe aqui o seu xingamento para a família Menin: </label>
        <input id="campo_xingamento" type="password" placeholder="Digite seu xingamento aqui"required>
        <br><br>
        <input type="radio" id="dog" name="animal" value="Cachoru">
        <label for="dog">Cachoru</label>
        <input type="radio" id="cat" name="animal" value="bixano">
        <label for="cat">bixanu</label>
        <input type="radio" id="maria" name="animal" value="cÚzeiro BBB Maria eu sei que você treme">
        <label for="maria">cÚzeiro BBB Maria eu sei que você treme</label>
        <input type="radio" id="rino" name="animal" value="Um belíssimo rinoceronte-de-java ameaçado de extinção">
        <label for="rino">Um belíssimo rinoceronte-de-java ameaçado de extinção</label>
        <br><br>
        <h2>Além da beleza, o que mais você admira em Givanildo?</h2>
        <input id="item1" type="checkbox" name="item1" value="O coração maior que a bunda">
        <label for="item1">O coração maior do que a bunda</label><br><br>
        <input id="item2" type="checkbox" name="item2" value="A forma como ele trata os torcedores">
        <label for="item2">A forma como ele trata os torcedores</label><br><br>
        <input id="item3" type="checkbox" name="item3" value="A forma como ele batia no cruzeiro">
        <label for="item3">A forma como ele batia no cruzeiro</label><br><br>
        <input id="item4" type="checkbox" name="item4" value="beleza">
        <label for="item4">beleza</label><br><br>

        <h2>Digite sua melhor lembrança do Hulk com a camisa 7 do manto alvinegro:</h2>
        <textarea name="mensagem" placeholder="Digite aqui sua mensagem" rows="15" cols="55"></textarea>
        <br><br>
        <input type="submit" value="Enviar abaixo assinado da saudade" required>
        <br><br><br>

        <button>Enviar o formulário só que nesse botão</button>
</form>

    <a href="index.html"> Voltar para site principal </a>
</body>
</html>
